{% load static %}<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>Ломбард «Золотой залог» - создать статью</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="form-page">
    <div class="header">
        <a class="all-posts" href="{% url 'archive' %}">Все записи</a>
        <img src="{% static 'img/logo.png' %}" />
    </div>
    <div class="content">
        <h1>Написать статью</h1>
        <form method="POST">{% csrf_token %}
            <input type="text" name="title" placeholder="Название статьи" value="{{ form.title }}">
            <textarea name="text" placeholder="Текст статьи">{{ form.text }}</textarea>
            <input type="submit" value="Сохранить">
        </form>
        <div class="errors">{{ form.errors }}</div>
    </div>
</body>
</html>
