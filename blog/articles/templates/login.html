{% load static %}<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>Ломбард «Золотой залог» - Вход</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="form-page">
    <div class="header">
        <a class="all-posts" href="{% url 'archive' %}">Все записи</a>
        <img src="{% static 'img/logo.png' %}" />
    </div>
    <div class="content auth">
        <h1>Вход</h1>
        <form method="POST">{% csrf_token %}
            <input type="text" name="username" placeholder="Логин" value="{{ form.username }}">
            <input type="password" name="password" placeholder="Пароль">
            <input type="submit" value="Войти">
        </form>
        <div class="errors">{{ form.errors }}</div>
        <p class="switch">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</body>
</html>
